version: '3.8'

services:
  app:
    build: .
    container_name: antrianar_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PORT: 3000
    ports:
      - "3001:3000"
    networks:
      - antrianar_network

networks:
  antrianar_network:
    driver: bridge